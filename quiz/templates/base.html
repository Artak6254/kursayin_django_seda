{% load static %}
<!DOCTYPE html>
<html lang="hy">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Font Awesome and Google Fonts -->
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600;700&display=swap"
            rel="stylesheet">
        <!-- Your CSS -->
        <link rel="stylesheet" href="{% static 'quiz/css/index.css' %}">
        <link rel="stylesheet" href="{% static 'quiz/css/header.css' %}">
        {% block extra_css %}{% endblock %}
        <title>Մտքի Բլոկ | Scratch Ծրագրավորման Դասեր</title>
    </head>

    <body>

        <header>
            <div class="logo">
                <a href="#">
                    <img src="{% static 'quiz/images/image2.png' %}" alt="/">
                </a>
            </div>
        <div class="burger" id="burger">
            <span></span>
            <span></span>
            <span></span>
        </div>
            <nav id="nav">
                <ul class="menu">
                    <li><a href="{% url 'index' %}">Գլխավոր</a></li>
                    <li><a href="{% url 'lesson' %}">Դասեր</a></li>
                    <li><a href="{% url 'fact' %}">Հետաքրքիր փաստեր</a></li>
                    <li><a href="{% url 'quizes' %}">Հարցաշար</a></li>
                    <li><a href="{% url 'contact' %}">Կապ մեզ հետ</a></li>
                </ul>
            </nav>
        </header>

        {% block content %}

        {% endblock %}
        <footer>
            <p>© 2025 Մտքի Բլոկ. Բոլոր իրավունքները պաշտպանված են:</p>
        </footer>

        {% block scripts %}{% endblock %}
          <script>
            console.log(1);
        //burger
        const burger = document.getElementById("burger");
        const nav = document.getElementById("nav");

        burger.addEventListener("click", () => {
            nav.classList.toggle("active");
        });

        // scroll-ի ժամանակ փակվի
        window.addEventListener("scroll", () => {
            nav.classList.remove("active");
        });

        // link սեղմելիս փակվի
        document.querySelectorAll("nav ul li a").forEach(link => {
            link.addEventListener("click", () => {
                nav.classList.remove("active");
            });
        });
    </script>


    </body>

</html>
